<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Conexión</title><link rel="stylesheet" href="estilo.css">
<style>code{display:block;word-break:break-all;padding:12px;border:1px solid var(--muted);border-radius:8px;color:var(--fg)}button{margin-top:12px;padding:10px 16px;font:inherit;cursor:pointer}</style></head>
<body><main>
<h1>Conexión de GTA Publicador</h1>
<div id="ok" hidden><p>Autorización recibida. Copiá este código y pegalo en la terminal (vence en pocos minutos):</p><code id="codigo"></code><button id="copiar">Copiar código</button></div>
<div id="error" hidden><p>La autorización no se completó: <span id="detalle"></span></p></div>
<div id="nada"><p>Esta página solo se usa al conectar cuentas.</p></div>
</main>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code'), err = p.get('error');
if (code) { document.getElementById('nada').hidden = true; document.getElementById('ok').hidden = false; document.getElementById('codigo').textContent = code;
  document.getElementById('copiar').onclick = () => navigator.clipboard.writeText(code).then(() => { document.getElementById('copiar').textContent = 'Copiado ✓'; }); }
else if (err) { document.getElementById('nada').hidden = true; document.getElementById('error').hidden = false; document.getElementById('detalle').textContent = err + ' ' + (p.get('error_description') || ''); }
</script></body></html>
